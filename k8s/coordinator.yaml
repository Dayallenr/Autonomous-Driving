apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: pathfinder
spec:
  # Deliberately 1 replica: the coordinator's state is in-memory and
  # per-instance by design (see pathfinder/rpc/coordinator.py's docstring —
  # the queue owns work durability, not the coordinator). Two replicas would
  # each think they own the run and would disagree about status.
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: pathfinder-coordinator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: EPISODES_TOTAL
              valueFrom:
                configMapKeyRef:
                  name: pathfinder-config
                  key: episodes-total
          args: ["--port", "50051", "--episodes-total", "$(EPISODES_TOTAL)"]
          ports:
            - containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: pathfinder
spec:
  selector:
    app: coordinator
  ports:
    - port: 50051
      targetPort: 50051
