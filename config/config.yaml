carla:
  host: "localhost"
  port: 2000
  timeout: 10.0          # seconds to wait for CARLA server
  map: "Town02"          # starting map
  synchronous: true      # use synchronous mode for deterministic stepping
  fixed_delta_seconds: 0.05  # 20 Hz simulation
  no_rendering: false    # set true for headless / faster data collection

ego:
  blueprint: "vehicle.lincoln.mkz_2017"
  spawn_index: 0         # which spawn point to use (0 = first available)
  target_speed: 30.0     # km/h default cruise speed

sensors:
  camera:
    width: 800
    height: 600
    fov: 90
    position: [1.5, 0.0, 2.4]   # [x, y, z] relative to vehicle
    rotation: [0.0, 0.0, 0.0]   # [pitch, yaw, roll]

  lidar:
    channels: 64
    range: 50.0
    points_per_second: 100000
    rotation_frequency: 20
    upper_fov: 10.0
    lower_fov: -30.0
    position: [0.0, 0.0, 2.5]
    rotation: [0.0, 0.0, 0.0]

  gnss:
    position: [0.0, 0.0, 0.0]
    noise_alt_bias: 0.0
    noise_lat_bias: 0.0
    noise_lon_bias: 0.0

  imu:
    position: [0.0, 0.0, 0.0]
    noise_accel_stddev_x: 0.005
    noise_accel_stddev_y: 0.005
    noise_accel_stddev_z: 0.005
    noise_gyro_stddev_x: 0.005
    noise_gyro_stddev_y: 0.005
    noise_gyro_stddev_z: 0.005

perception:
  model_path: "models/best_perception_model.pt"
  confidence_threshold: 0.4
  iou_threshold: 0.45
  input_size: 640           # YOLO input resolution
  device: "cpu"             # "cpu" or "cuda" or "mps"
  # KITTI classes: {0:car, 1:van, 2:truck, 3:pedestrian, 4:person_sitting, 5:cyclist, 6:tram, 7:misc}
  class_names:
    0: "car"
    1: "van"
    2: "truck"
    3: "pedestrian"
    4: "person_sitting"
    5: "cyclist"
    6: "tram"
    7: "misc"
  # Classes that require safety-critical responses
  dynamic_classes: [0, 1, 2, 3, 4, 5]

localization:
  # EKF noise parameters
  process_noise_pos: 0.1
  process_noise_vel: 0.5
  process_noise_heading: 0.05
  gnss_noise_std: 3.0       # metres
  imu_accel_noise_std: 0.01
  imu_gyro_noise_std: 0.01

prediction:
  horizon_seconds: 2.0
  dt: 0.05                  # must match simulation fixed_delta_seconds
  max_age: 10               # frames before a track is dropped
  min_hits: 3               # frames before a track is confirmed
  iou_threshold: 0.3        # IoU for track association

planning:
  cil_model_path: "models/cil_model.pt"
  waypoint_lookahead: 5     # number of waypoints to generate
  waypoint_spacing: 2.0     # metres between waypoints
  # High-level commands (match CARLA RoadOption)
  commands:
    0: "follow_lane"
    1: "turn_left"
    2: "turn_right"
    3: "go_straight"

control:
  # Lateral PID
  lateral:
    kp: 0.8
    ki: 0.05
    kd: 0.2
    max_steer: 1.0
  # Longitudinal PID
  longitudinal:
    kp: 0.5
    ki: 0.05
    kd: 0.1
    max_throttle: 0.75
    max_brake: 0.5
  # Speed adjustments near detected objects (km/h)
  speed_near_pedestrian: 10.0
  speed_near_vehicle: 20.0
  proximity_threshold: 15.0  # metres

data_collection:
  output_dir: "data/demonstrations"
  num_episodes: 20
  steps_per_episode: 2000    # ~100 seconds at 20 Hz
  towns: ["Town01", "Town02"]
  target_speed: 30.0         # km/h for autopilot during collection

training:
  batch_size: 32
  learning_rate: 0.0001
  num_epochs: 50
  validation_split: 0.1
  checkpoint_dir: "models/"
  log_interval: 50           # steps between log prints
