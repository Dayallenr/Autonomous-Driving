# --idle-timeout-seconds 0 is the "run forever" mode added specifically for
# this Deployment: a Pod whose process exits looks like a crash to the
# Deployment controller, which just restarts it into another empty queue —
# an endless restart loop. A long-running consumer that blocks waiting for
# work is what a Deployment (and `kubectl scale`) actually expects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pathfinder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Long enough for an in-flight kinematic episode (seconds, not minutes)
      # to finish before SIGKILL — see scripts/run_worker.py's SIGTERM handler.
      terminationGracePeriodSeconds: 20
      containers:
        - name: worker
          image: pathfinder-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: QUEUE_NAME
              valueFrom:
                configMapKeyRef:
                  name: pathfinder-config
                  key: queue-name
            - name: QUEUE_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: pathfinder-config
                  key: queue-endpoint-url
            - name: QUEUE_REGION
              valueFrom:
                configMapKeyRef:
                  name: pathfinder-config
                  key: queue-region
          args:
            - "--worker-id=$(POD_NAME)"
            - "--coordinator=coordinator:50051"
            - "--queue-backend=sqs"
            - "--queue-name=$(QUEUE_NAME)"
            - "--queue-endpoint-url=$(QUEUE_ENDPOINT_URL)"
            - "--queue-region=$(QUEUE_REGION)"
            - "--simulator-backend=kinematic"
            - "--idle-timeout-seconds=0"
