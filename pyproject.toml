[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    # Generated by protoc; regenerate with scripts/generate_protos.py.
    "pathfinder/rpc/generated",
    # Cell-local imports (E402) are the normal notebook idiom.
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]
