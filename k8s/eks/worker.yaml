# Real-AWS counterpart to k8s/worker.yaml (kind): no LocalStack, no static
# AWS_ACCESS_KEY_ID/SECRET — auth is IRSA via the pathfinder-worker
# ServiceAccount (serviceaccount.yaml). Same --idle-timeout-seconds=0
# "run forever" reasoning as the kind version: a Deployment expects a
# long-running process, not one that exits when its queue is briefly empty.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pathfinder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: pathfinder-worker
      terminationGracePeriodSeconds: 20
      containers:
        - name: worker
          image: "${ECR_WORKER_IMAGE}"
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: pathfinder-config
                  key: sqs-queue-url
            - name: TELEMETRY_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: pathfinder-config
                  key: telemetry-stream-name
            - name: AWS_REGION_NAME
              valueFrom:
                configMapKeyRef:
                  name: pathfinder-config
                  key: aws-region
          args:
            - "--worker-id=$(POD_NAME)"
            - "--coordinator=coordinator:50051"
            - "--queue-backend=sqs"
            - "--queue-url=$(SQS_QUEUE_URL)"
            - "--queue-region=$(AWS_REGION_NAME)"
            - "--simulator-backend=kinematic"
            - "--idle-timeout-seconds=0"
            - "--telemetry-backend=kinesis"
            - "--telemetry-stream-name=$(TELEMETRY_STREAM_NAME)"
            - "--telemetry-region=$(AWS_REGION_NAME)"
