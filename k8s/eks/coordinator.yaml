# Identical topology to k8s/coordinator.yaml (kind) — the coordinator never
# touches AWS, so nothing about it changes between local and real-EKS. Only
# the image reference differs (ECR instead of a locally-built/loaded image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: pathfinder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: "${ECR_COORDINATOR_IMAGE}"
          imagePullPolicy: Always
          env:
            - name: EPISODES_TOTAL
              valueFrom:
                configMapKeyRef:
                  name: pathfinder-config
                  key: episodes-total
          args: ["--port", "50051", "--episodes-total", "$(EPISODES_TOTAL)"]
          ports:
            - containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: pathfinder
spec:
  selector:
    app: coordinator
  ports:
    - port: 50051
      targetPort: 50051
