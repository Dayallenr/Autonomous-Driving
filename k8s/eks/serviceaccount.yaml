# The IRSA binding: this ServiceAccount's name/namespace match exactly what
# terraform/irsa.tf's trust policy condition checks
# (system:serviceaccount:pathfinder:pathfinder-worker) — any Pod using this
# ServiceAccount can assume that IAM role via its projected token, with no
# static AWS keys anywhere in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pathfinder-worker
  namespace: pathfinder
  annotations:
    eks.amazonaws.com/role-arn: "${WORKER_IRSA_ROLE_ARN}"
