name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    name: Docker build & scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [coordinator, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile.${{ matrix.target }}
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile.${{ matrix.target }}
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.target }}
          tags: pathfinder-${{ matrix.target }}:ci
          push: false
          load: true
      - name: Scan for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pathfinder-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          format: table
          # Report, don't fail the build: these images are ~99% base-OS
          # packages this repo doesn't control (see the table this step
          # prints for what's actually flagged). Flip to a nonzero exit-code
          # once there's a documented triage process for acting on it.
          exit-code: "0"

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  terraform:
    name: Terraform validate & checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether terraform/ exists yet
        id: has_tf
        run: echo "present=$([ -d terraform ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4.0.1
        if: steps.has_tf.outputs.present == 'true'
      - name: terraform fmt -check
        if: steps.has_tf.outputs.present == 'true'
        working-directory: terraform
        run: terraform fmt -check -recursive
      # -backend=false: validate is a static check on the config, not the
      # applied state, so no AWS credentials are needed to run it in CI.
      - name: terraform init
        if: steps.has_tf.outputs.present == 'true'
        working-directory: terraform
        run: terraform init -backend=false
      - name: terraform validate
        if: steps.has_tf.outputs.present == 'true'
        working-directory: terraform
        run: terraform validate
      - name: checkov static analysis
        if: steps.has_tf.outputs.present == 'true'
        uses: bridgecrewio/checkov-action@v12.3116.0
        with:
          directory: terraform
          framework: terraform
      - name: (no-op until Phase 7 adds terraform/)
        if: steps.has_tf.outputs.present == 'false'
        run: echo "terraform/ does not exist yet — nothing to validate"
